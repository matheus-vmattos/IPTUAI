name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'frontend/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias do backend (empacotado dentro do app)
        working-directory: backend
        run: npm ci --omit=dev

      - name: Instalar dependencias do frontend
        run: npm ci

      - name: Build do renderer
        run: npm run build:renderer

      - name: Empacotar e publicar instalador Windows como GitHub Release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar instalador tambem como artefato do Actions
        uses: actions/upload-artifact@v4
        with:
          name: IPTUAI-Windows-Installer
          path: frontend/release/*.exe
          retention-days: 30
